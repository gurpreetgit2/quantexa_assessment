apply plugin: 'scala'
apply plugin: 'eclipse'
apply plugin: 'application'

dependencies {
    implementation 'org.scala-lang:scala-library:2.12.8'
    implementation group: 'org.apache.spark', name: 'spark-core_2.12', version: '3.5.1'
    implementation group: 'org.apache.spark', name: 'spark-sql_2.12', version: '3.5.1'
    testImplementation 'org.scalatest:scalatest_2.12:3.2.17'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.pegdown:pegdown:1.4.2'
}

repositories {
	mavenCentral()
	// maven { url "https://repo.spring.io/snapshot" }
	// maven { url "https://repo.spring.io/milestone" }
	maven { 
        url =  uri("http://repository.apache.org/snapshots/")
        allowInsecureProtocol = true
    }
}

buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "gradle.plugin.com.github.maiflai:gradle-scalatest:0.26"
    }
}

apply plugin: 'com.github.maiflai.scalatest'

application {
    mainClass = 'com.quantexa.assessments.accounts.AccountAssessment'
    applicationDefaultJvmArgs = [
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens=java.base/java.nio=ALL-UNNAMED'
    ]
}

